name: Build, test and deploy

on:
  push:
    branches: [main, canonical-www]
    paths: [frontend/**, .github/workflows/deploy.yml]
  pull_request:
    branches: [main, canonical-www]
    paths: [frontend/**, .github/workflows/deploy.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build (client + SSR prerender)
        working-directory: frontend
        run: npm run build

      - name: Check prerender output
        working-directory: frontend
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/learn/articles/index.html
          grep -q 'application/ld+json' dist/learn/bankroll/index.html

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: frontend/dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
